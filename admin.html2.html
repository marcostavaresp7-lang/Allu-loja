<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Painel Allu</title>
<style>:root{--bg:#fbf6f1;--s:#fff;--tx:#2b1a1f;--m:#7a6a6e;--g:#b08a4a;--l:#eadfd6}@media(prefers-color-scheme:dark){:root{--bg:#1a0f13;--s:#26171c;--tx:#f4e9e2;--m:#b5a3a6;--g:#d4ad6a;--l:#3a262d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:20px;max-width:1000px;margin:auto}
h1{font-family:Georgia,serif;font-weight:500}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--l);background:var(--s);color:var(--tx);width:100%;margin:6px 0}button{background:#6e1230;color:#fff;border:0;cursor:pointer}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}.k div{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:12px;color:var(--m);font-size:13px}.k b{display:block;font:500 24px Georgia,serif;color:var(--g)}
.w{overflow-x:auto;background:var(--s);border:1px solid var(--l);border-radius:12px;padding:8px;margin-bottom:18px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--l);white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:var(--m);font-weight:400}h2{font-family:Georgia,serif;font-weight:500}</style></head><body>
<h1>Painel Allu</h1><div id="login"><input id="pw" type="password" placeholder="Senha do painel"><button onclick="go()">Entrar</button></div><div id="out"></div>
<script>
const R=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const ST={approved:"Pago",pending:"Aguardando",in_process:"Em análise",rejected:"Recusado",cancelled:"Cancelado"};
async function go(){const pw=document.getElementById("pw").value;const r=await fetch("/.netlify/functions/api?a=admin",{headers:{"x-admin-password":pw}});
 if(!r.ok){alert("Senha incorreta");return}const d=await r.json();document.getElementById("login").style.display="none";
 const ok=d.orders.filter(o=>o.status==="approved");const by={};ok.forEach(o=>{const b=by[o.ref]=by[o.ref]||{n:0,q:0,v:0,c:0};b.n++;b.q+=o.qtd;b.v+=o.total;b.c+=o.comissao});
 const tv=ok.reduce((s,o)=>s+o.total,0),tc=ok.reduce((s,o)=>s+o.comissao,0);
 document.getElementById("out").innerHTML=`<div class="k"><div>Pedidos pagos<b>${ok.length}</b></div><div>Vendas pagas<b>${R(tv)}</b></div><div>Comissões<b>${R(tc)}</b></div></div>
 <h2>Comissão por divulgadora (só pedidos pagos)</h2><div class="w"><table><tr><th>Divulgadora</th><th>Pedidos</th><th>Itens</th><th>Vendas</th><th>Comissão</th></tr>${Object.entries(by).sort((a,b)=>b[1].v-a[1].v).map(([r,b])=>`<tr><td><b>${esc(r)}</b></td><td>${b.n}</td><td>${b.q}</td><td>${R(b.v)}</td><td><b>${R(b.c)}</b></td></tr>`).join("")||"<tr><td colspan=5>Nenhuma venda paga ainda.</td></tr>"}</table></div>
 <h2>Todos os pedidos</h2><div class="w"><table><tr><th>Data</th><th>Status</th><th>Divulgadora</th><th>Cliente</th><th>Itens</th><th>Total</th></tr>${d.orders.map(o=>`<tr><td>${new Date(o.ts).toLocaleString("pt-BR")}</td><td>${ST[o.status]||esc(o.status)}</td><td><b>${esc(o.ref)}</b></td><td>${esc(o.cliente.nome)}<br><small>${esc(o.cliente.whatsapp)}<br>${esc(o.cliente.endereco)}</small></td><td>${o.itens.map(i=>i.q+"× "+esc(i.nome)).join("<br>")}</td><td>${R(o.total)}</td></tr>`).join("")||"<tr><td colspan=6>Sem pedidos.</td></tr>"}</table></div>`}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
</script></body></html>
